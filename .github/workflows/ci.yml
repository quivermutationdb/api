name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  math-pipeline:
    name: Python pipeline (pytest + golden IDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Validate curated nicknames
        run: python scripts/nicknames.py --check

  worker:
    name: Worker (typecheck + API smoke against local D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run typecheck

      # Build the dataset the same way production is loaded, into a local D1.
      - run: npm run db:migrate:local
      - run: python scripts/populate.py --export-d1 dist/d1
      - run: scripts/import-d1.sh dist/d1
      - run: python scripts/nicknames.py --sql dist/nicknames.sql && npx wrangler d1 execute qmd --local --file=dist/nicknames.sql

      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health
      - run: npm run test:api
      - name: Show wrangler log on failure
        if: failure()
        run: cat wrangler-dev.log

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan every commit, not just HEAD
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks git --redact --exit-code 1 --no-banner --verbose .
      - name: Scan working tree
        run: gitleaks dir --redact --exit-code 1 --no-banner .
