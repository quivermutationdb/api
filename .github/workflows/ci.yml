name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  math-pipeline:
    name: Python pipeline (pytest + golden IDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Validate curated nicknames
        run: python scripts/nicknames.py --check

  worker:
    name: Worker (typecheck + API smoke against Postgres)
    runs-on: ubuntu-latest

    # The API is served from Postgres, so the smoke tests must run against
    # Postgres. The dataset is generated and loaded by the same path production
    # takes (scripts/pg-load-local.sh), just on a cell small enough for CI --
    # a second, CI-only load path could drift from the real one without anyone
    # noticing until a release.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qmd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: qmd
      # wrangler dev talks to the service through the Hyperdrive binding's local
      # connection string; the binding's `id` is only used in production.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/qmd

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run typecheck

      - name: Generate the dev dataset and load it into Postgres
        run: scripts/pg-load-local.sh

      - name: Verify the load
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/pg-verify.sql

      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health
      - run: npm run test:api
      - name: Show wrangler log on failure
        if: failure()
        run: cat wrangler-dev.log

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan every commit, not just HEAD
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks git --redact --exit-code 1 --no-banner --verbose .
      - name: Scan working tree
        run: gitleaks dir --redact --exit-code 1 --no-banner .
