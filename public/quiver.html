<main class="page" id="page-content">
  <div class="state-msg"><div class="spinner"></div>Loading quiver…</div>
</main>

<script src="/quiver-draw.js"></script>
<script>
const API = '/api';
const qid = new URLSearchParams(location.search).get('id');
const QID_RE = /^Q\.n\d+\.[0-9a-f]{16}$/;

const esc = s => String(s).replace(/[&<>"']/g,
  ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
function showMessage(html) {
  document.getElementById('page-content').innerHTML = `<div class="state-msg">${html}</div>`;
}
const BROWSE_LINK = '<a href="/browse.html" style="color:var(--accent)">Browse all quivers →</a>';

function renderMatrix(matrix) {
  const n = matrix.length;
  const grid = document.createElement('div');
  grid.className = 'matrix-grid';
  grid.style.gridTemplateColumns = `repeat(${n}, auto)`;
  matrix.forEach(row => row.forEach(val => {
    const cell = document.createElement('div');
    cell.className = 'matrix-cell ' + (val > 0 ? 'pos' : val < 0 ? 'neg' : 'zero');
    cell.textContent = val;
    grid.appendChild(cell);
  }));
  const wrap = document.createElement('div');
  wrap.className = 'matrix-container';
  const lb = document.createElement('span'); lb.className = 'matrix-bracket left';
  const rb = document.createElement('span'); rb.className = 'matrix-bracket right';
  wrap.appendChild(lb); wrap.appendChild(grid); wrap.appendChild(rb);
  return wrap;
}

function renderPage(q) {
  document.title = `${q.qmd_id} — QMD`;
  const n = q.exchange_matrix.length;
  const isOpen = q.is_open;
  const dynkin = q.dynkin_type ?? '—';
  const yn = v => v === true ? 'Yes' : v === false ? 'No'
    : '<span style="color:var(--ink-light)">Unknown</span>';
  const rep = q.representation_type
    ? q.representation_type.charAt(0).toUpperCase() + q.representation_type.slice(1)
    : '—';
  const sym = q.symmetry_group
    ? `${q.symmetry_group.name} <span style="color:var(--ink-light)">(order ${q.symmetry_group.order})</span>`
    : '—';

  const content = document.getElementById('page-content');
  content.innerHTML = `
    <div class="breadcrumb">
      <a href="/browse.html">Browse</a>
      <span>/</span>
      <span>${q.qmd_id}</span>
    </div>

    <div class="title-block">
      <div class="qid">${q.qmd_id}</div>
      <h1>${q.label ?? ('Rank-' + n + ' Quiver')}</h1>
      <span class="badge ${isOpen ? 'badge-open' : 'badge-closed'}">
        ${isOpen ? 'Open class' : 'Finite type'}
      </span>
    </div>

    <div class="two-col">
      <div class="section" id="quiver-section">
        <div class="section-label">Quiver</div>
      </div>
      <div class="section">
        <div class="section-label">Properties</div>
        <div class="meta-list">
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#rank">Rank</a></span><span class="val">${n}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#dynkin-type">Dynkin type</a></span><span class="val">${dynkin}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#representation-type">Representation type</a></span><span class="val">${rep}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#acyclic">Acyclic</a></span><span class="val">${yn(q.is_acyclic)}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#connected">Connected</a></span><span class="val">${yn(q.is_connected)}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#bipartite">Bipartite</a></span><span class="val">${yn(q.is_bipartite)}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#abundant">Abundant</a></span><span class="val">${yn(q.is_abundant)}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#planar">Planar</a></span><span class="val">${yn(q.is_planar)}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#max-edge">Max edge weight</a></span><span class="val">${q.max_edge ?? '—'}</span></div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#symmetry-group">Symmetry group</a></span><span class="val">${sym}</span></div>
          <div class="meta-row">
            <span class="key"><a class="def-link" href="/wiki.html#mutation-class">Mutation class</a></span>
            <span class="val">
              <a href="/class.html?id=${encodeURIComponent(q.mc_id)}">${q.mc_id}</a>
            </span>
          </div>
          <div class="meta-row"><span class="key"><a class="def-link" href="/wiki.html#mutation-class-size">Mutation class size</a></span><span class="val">${q.class_size ?? (isOpen ? '∞' : '—')}</span></div>
        </div>
      </div>
    </div>

    <div class="section section-full">
      <div class="section-label">Tags</div>
      <div class="tags" id="tags-container">
        ${(q.tags ?? []).length === 0
          ? '<span style="color:var(--ink-light);font-style:italic;font-size:0.88rem">No tags</span>'
          : (q.tags ?? []).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
    </div>

    <div class="section section-full">
      <div class="section-label">
        Quivers in this mutation class
        ${q.class_size ? `<span style="font-weight:400;opacity:0.6"> — ${q.class_size} total</span>` : ''}
      </div>
      <div id="class-members-container">
        <div class="state-msg" style="padding:2rem">
          <div class="spinner"></div>Loading class members…
        </div>
      </div>
    </div>
  `;

  // Draw the quiver; keep the exchange matrix available in a collapsible
  const quiverSection = document.getElementById('quiver-section');
  const fig = document.createElement('div');
  fig.className = 'quiver-figure';
  fig.appendChild(renderQuiver(q.exchange_matrix));
  quiverSection.appendChild(fig);

  const details = document.createElement('details');
  details.className = 'matrix-details';
  const summary = document.createElement('summary');
  summary.textContent = 'Exchange matrix';
  details.appendChild(summary);
  details.appendChild(renderMatrix(q.exchange_matrix));
  quiverSection.appendChild(details);

  // Load class members
  fetchClassMembers(q.mc_id, q.qmd_id);
}

async function fetchClassMembers(mcId, currentQid) {
  const container = document.getElementById('class-members-container');
  try {
    const res = await fetch(`${API}/classes/${encodeURIComponent(mcId)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderClassMembers(data, currentQid);
  } catch (e) {
    console.error(e);
    container.innerHTML = '<p style="padding:1rem;color:var(--ink-light);font-style:italic">Class members are temporarily unavailable.</p>';
  }
}

// One row per *distinct* quiver in the class (the API collapses the labeled
// orbit for us). A quiver's ID is a property of the unlabeled quiver, so the
// canonical representative and the current quiver each appear exactly once,
// with the number of labelings the orbit contains shown alongside.
function renderClassMembers(data, currentQid) {
  const container = document.getElementById('class-members-container');
  const members = data.distinct_quivers || [];
  if (members.length === 0) {
    container.innerHTML = '<p style="padding:1rem;color:var(--ink-light);font-style:italic">No members found.</p>';
    return;
  }
  const canonicalQid = data.canonical_qid;
  const rows = members.map(m => {
    const isCurrent = m.qmd_id === currentQid;
    const isCanon = m.qmd_id === canonicalQid;
    const notes = [];
    if (isCanon) notes.push('★ canonical rep');
    if (isCurrent) notes.push('current');
    const labelings = m.labeling_count ?? 1;
    return `<tr class="${isCanon ? 'is-canon' : ''}">
      <td>${isCurrent
        ? `<span style="font-family:var(--mono);font-size:0.72rem">${m.qmd_id}</span>`
        : `<a href="/quiver.html?id=${encodeURIComponent(m.qmd_id)}">${m.qmd_id}</a>`}
      </td>
      <td class="mono" style="text-align:right">${labelings}</td>
      <td class="mono">${notes.join(' · ')}</td>
    </tr>`;
  }).join('');
  const labeledTotal = members.reduce((acc, m) => acc + (m.labeling_count ?? 1), 0);
  container.innerHTML = `
    <table class="members-table">
      <thead><tr><th>Quiver ID</th><th style="text-align:right">Labelings</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="padding:0.75rem;font-family:var(--mono);font-size:0.72rem;color:var(--ink-light)">${members.length} distinct quiver${members.length === 1 ? '' : 's'} · ${labeledTotal} labeled exchange matrices${data.is_open ? ' explored so far (open class)' : ''}.</p>
  `;
}

async function fetchQuiver(id) {
  const res = await fetch(`${API}/quivers/${encodeURIComponent(id)}`);
  if (!res.ok) {
    const err = new Error(`HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  document.getElementById('api-status').textContent = 'connected';
  return res.json();
}

if (!qid) {
  showMessage(`No quiver ID specified. ${BROWSE_LINK}`);
} else if (!QID_RE.test(qid)) {
  showMessage(`<code>${esc(qid)}</code> is not a quiver ID (expected <code>Q.n&lt;rank&gt;.&lt;16 hex digits&gt;</code>). ${BROWSE_LINK}`);
} else {
  fetchQuiver(qid).then(renderPage).catch(err => {
    console.error(err);
    if (err.status === 404) {
      showMessage(`No quiver with ID <code>${esc(qid)}</code> in the database. ${BROWSE_LINK}`);
    } else {
      document.getElementById('api-status').textContent = 'unavailable';
      showMessage('The database is temporarily unavailable. Please try again shortly.');
    }
  });
}
</script>
